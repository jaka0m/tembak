{% extends "base.html" %}

{% block title %}Registrasi Dukcapil - MYnyak Engsel Web UI{% endblock %}

{% block content %}
<div class="space-y-6">
  <div class="neu-card max-w-xl mx-auto">
    <h2 class="text-base font-bold text-slate-100 mb-1 flex items-center gap-2">
      <i class="fa-solid fa-address-card text-indigo-400"></i> Form Registrasi Dukcapil
    </h2>
    <p class="text-xs text-slate-400 mb-4">Lengkapi NIK dan KK untuk registrasi nomor.</p>

    <form action="/dukcapil" method="POST" class="space-y-3">
      <div>
        <label class="neu-label">Nomor HP (628xxx)</label>
        <input type="text" name="msisdn" placeholder="628xxxxxxxxx" required class="neu-input">
      </div>
      <div>
        <label class="neu-label">NIK (16 Digit)</label>
        <input type="text" name="nik" placeholder="320xxxxxxxxxxxxx" required class="neu-input font-mono">
      </div>
      <div>
        <label class="neu-label">Nomor KK (16 Digit)</label>
        <input type="text" name="kk" placeholder="320xxxxxxxxxxxxx" required class="neu-input font-mono">
      </div>
      <button type="submit" class="neu-btn neu-btn-primary btn-primary w-full py-2.5 text-xs mt-2">
        <i class="fa-solid fa-rocket mr-1"></i> Submit Registrasi Dukcapil
      </button>
    </form>

    {% if result %}
    <div class="mt-6 pt-4 border-t border-slate-800/30">
      <h3 class="neu-label mb-2">Hasil Respon API:</h3>
      <pre class="neu-inset-card p-3 rounded-xl text-emerald-400 text-xs font-mono whitespace-pre-wrap break-all">{{ result }}</pre>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
