{% extends "base.html" %}

{% block title %}Validate MSISDN - MYnyak Engsel Web UI{% endblock %}

{% block content %}
<div class="space-y-6">
  <div class="neu-card max-w-xl mx-auto">
    <h2 class="text-base font-bold text-slate-100 mb-1 flex items-center gap-2">
      <i class="fa-solid fa-shield-check text-indigo-400"></i> Validasi Nomor XL / Axis
    </h2>
    <p class="text-xs text-slate-400 mb-4">Validasi status nomor XL / Axis.</p>

    <form action="/validate" method="POST" class="space-y-3">
      <div>
        <label class="neu-label">Nomor HP (MSISDN: 628xxx)</label>
        <input type="text" name="msisdn" placeholder="628xxxxxxxxx" required class="neu-input font-mono">
      </div>
      <button type="submit" class="neu-btn neu-btn-primary btn-primary w-full py-2.5 text-xs">
        <i class="fa-solid fa-magnifying-glass mr-1"></i> Validasi Nomor
      </button>
    </form>

    {% if result %}
    <div class="mt-6 pt-4 border-t border-slate-800/30">
      <h3 class="neu-label mb-2">Hasil Respon API:</h3>
      <pre class="neu-inset-card p-3 rounded-xl text-emerald-400 text-xs font-mono whitespace-pre-wrap break-all">{{ result }}</pre>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
